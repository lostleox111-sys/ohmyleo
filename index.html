<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">

<title>OH MY LEO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
        url('https://raw.githubusercontent.com/lostleox111-sys/ohmyleo/main/aba8b48057b9220eb404a136dfe5bb3b.jpg')
        center center / cover no-repeat fixed;
}

/* Koyu arka plan */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 45%,rgba(20,55,110,.18),transparent 45%),
        linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,7,20,.78));
    z-index:-2;
}

/* Hafif ışık efekti */
body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(25,80,160,.10);
    filter:blur(100px);
    border-radius:50%;
    z-index:-1;
    pointer-events:none;
}

/* HEADER */
header{
    position:relative;
    z-index:10;
    width:100%;
    height:82px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(3,8,20,.58);
    border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:3px;
    text-shadow:0 0 20px rgba(255,255,255,.25);
}

nav{
    display:flex;
    gap:8px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1.5px;
    padding:11px 17px;
    border-radius:12px;
    transition:.3s ease;
}

nav a:hover{
    background:rgba(255,255,255,.10);
    transform:translateY(-2px);
}

/* ANA ALAN */
main{
    min-height:calc(100vh - 82px);
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px 20px;
}

/* Küçük üst yazı */
.badge{
    margin-bottom:18px;
    padding:8px 16px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
    font-size:11px;
    letter-spacing:3px;
    color:#d8e5ff;
}

/* BAŞLIK */
h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,6vw,72px);
    line-height:1.02;
    letter-spacing:7px;
    font-weight:700;
    text-shadow:
        0 5px 30px rgba(0,0,0,.9),
        0 0 50px rgba(30,80,150,.25);

    animation:titleIn 1s ease forwards;
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ALT YAZI */
.sub{
    margin-top:20px;
    font-size:13px;
    letter-spacing:5px;
    color:#d7dce7;
    opacity:.9;
}

/* KARTLAR */
.cards{
    margin-top:42px;
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
}

.card{
    position:relative;
    width:220px;
    min-height:155px;
    padding:28px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:#fff;
    text-decoration:none;

    background:rgba(5,10,22,.55);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transition:
        transform .35s ease,
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.08),
        transparent 45%
    );
    opacity:0;
    transition:.35s;
}

.card:hover{
    transform:translateY(-10px) scale(1.025);
    background:rgba(15,30,55,.68);
    border-color:rgba(150,190,255,.35);
    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(50,110,200,.12);
}

.card:hover::before{
    opacity:1;
}

.icon{
    position:relative;
    font-size:38px;
    margin-bottom:15px;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.5));
}

.card strong{
    position:relative;
    font-size:14px;
    letter-spacing:2.5px;
}

.card span{
    position:relative;
    margin-top:9px;
    font-size:12px;
    color:#bfc8d8;
}

/* MOBİL */
@media(max-width:700px){

    body{
        background-attachment:scroll;
    }

    header{
        height:auto;
        min-height:75px;
        padding:14px 18px;
        flex-direction:column;
        gap:10px;
    }

    .logo{
        font-size:18px;
    }

    nav{
        gap:4px;
    }

    nav a{
        font-size:11px;
        padding:9px 12px;
    }

    main{
        min-height:calc(100vh - 110px);
        padding:45px 15px 35px;
    }

    .badge{
        font-size:9px;
        letter-spacing:2px;
        margin-bottom:15px;
    }

    h1{
        font-size:clamp(32px,9vw,48px);
        letter-spacing:4px;
    }

    .sub{
        margin-top:16px;
        font-size:10px;
        letter-spacing:3px;
    }

    .cards{
        margin-top:30px;
        gap:12px;
    }

    .card{
        width:calc(50% - 8px);
        min-height:135px;
        padding:20px 10px;
        border-radius:16px;
    }

    .icon{
        font-size:30px;
        margin-bottom:10px;
    }

    .card strong{
        font-size:11px;
    }

    .card span{
        font-size:10px;
    }
}

/* ÇOK KÜÇÜK TELEFONLAR */
@media(max-width:390px){

    h1{
        font-size:29px;
        letter-spacing:3px;
    }

    .card{
        width:100%;
        max-width:260px;
        min-height:105px;
    }

    .cards{
        gap:10px;
    }
}

/* TABLET */
@media(min-width:701px) and (max-width:1100px){

    header{
        padding:0 4%;
    }

    h1{
        font-size:clamp(45px,7vw,65px);
    }

    .card{
        width:200px;
    }
}

/* Hareket azaltma tercihi */
@media(prefers-reduced-motion:reduce){

    *{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>
